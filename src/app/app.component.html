@defer (on interaction(display); prefetch on interaction(prefetch)) {
  <div class="courses">

    @for (course of courses; track $index; let count = $count) {
      <course-card
        (courseSelected)="onCourseSelected($event)"
        [course]="course"
        [index]="$index"
        />
    }

    <!-- <course-card *ngFor="let course of courses | slice: 0:2; index as i;"
      (courseSelected)="onCourseSelected($event)"
      [course]="course"
      [index]="i+1"
    ></course-card> -->
  </div>
}
@placeholder {
  <h2>This is the placeholder!</h2>
  <!-- <input placeholder="This is the placeholder!" /> -->
}
@loading {
  <h2>This is a loading indicator...</h2>
}
@error {
  <h2>An error occurred.</h2>
}
